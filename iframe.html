<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google — Sign in</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      min-height: 100vh;
    }

    .logo {
      margin-bottom: 32px;
    }
    .logo svg { width: 75px; height: 24px; }

    .card {
      width: 100%;
      max-width: 400px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 40px 40px 36px;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      color: #202124;
      margin-bottom: 8px;
      text-align: center;
    }
    .subtitle {
      font-size: 16px;
      color: #202124;
      text-align: center;
      margin-bottom: 32px;
    }

    .input-group {
      position: relative;
      margin-bottom: 24px;
    }
    .input-group input {
      width: 100%;
      height: 56px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 16px 12px 0;
      font-size: 16px;
      outline: none;
      color: #202124;
    }
    .input-group input:focus {
      border-color: #1a73e8;
      border-width: 2px;
    }
    .input-group label {
      position: absolute;
      top: 18px;
      left: 13px;
      font-size: 16px;
      color: #80868b;
      pointer-events: none;
      transition: all 0.15s;
    }
    .input-group input:focus ~ label,
    .input-group input:not(:placeholder-shown) ~ label {
      top: 6px;
      font-size: 12px;
      color: #1a73e8;
    }

    .forgot {
      display: block;
      color: #1a73e8;
      font-size: 14px;
      margin-bottom: 28px;
      text-decoration: none;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .create-account {
      color: #1a73e8;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    .next-btn {
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.25px;
    }
    .next-btn:hover { background: #1557b0; }

    .footer {
      margin-top: auto;
      padding-top: 32px;
      display: flex;
      gap: 24px;
      font-size: 12px;
      color: #80868b;
    }
    .footer a { color: #80868b; text-decoration: none; }
  </style>
</head>
<body>

<!-- Google Logo SVG -->

  </svg>
</div>

<div class="card">
  <h1>Sign in</h1>
  <p class="subtitle">to continue to Gmail</p>

  <div class="input-group">
    <input type="email" id="email" placeholder=" ">
    <label for="email">Email or phone</label>
  </div>

  <a href="#" class="forgot">Forgot email?</a>

  <div style="font-size:14px;color:#202124;margin-bottom:28px;">
    Not your computer? Use Guest mode to sign in privately.
    <a href="#" style="color:#1a73e8;text-decoration:none;"> Learn more</a>
  </div>

  <div class="actions">
    <a href="#" class="create-account">Create account</a>
    <button class="next-btn">Next</button>
  </div>
</div>

<div class="footer">
  <a href="#">Help</a>
  <a href="#">Privacy</a>
  <a href="#">Terms</a>
</div>

</body>
</html>
