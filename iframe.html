<!DOCTYPE html><body style="font-family:Arial;text-align:center">
<p>IFRAME = origin B</p>
<p id="io"></p>
<button id="b" style="font-size:16px;padding:10px">Tap (open tel: from inside iframe)</button>
<script>
  document.getElementById('io').textContent = 'iframe origin = ' + location.origin;
  // navigation initiated INSIDE the iframe → sourceFrame = this iframe
  document.getElementById('b').onclick = function(){
    location.href = 'tel:+100000000';   // also try: 'mailto:x@x.com', 'sms:+1', 'geo:0,0'
  };
</script>
</body>
