<!DOCTYPE html><body style="font-family:Arial;text-align:center">
<p>IFRAME = origin B</p>
<p id="io"></p>
<div style="display:flex;flex-direction:column;gap:8px;max-width:300px;margin:auto">
  <button onclick="go('tel:+10000000')">tel: (Phone)</button>
  <button onclick="go('mailto:test@example.com')">mailto: (Mail)</button>
  <button onclick="go('sms:+10000000')">sms: (Messages)</button>
  <button onclick="go('facetime:test@example.com')">facetime:</button>
  <button onclick="go('maps://?q=test')">maps:// (Apple Maps)</button>
  <button onclick="go('http://maps.apple.com/?q=test')">maps.apple.com (Maps)</button>
  <button onclick="go('itms-apps://itunes.apple.com')">itms-apps:// (App Store)</button>
  <button onclick="go('foobar://test')">foobar:// (custom/unknown)</button>
</div>
<pre id="log"></pre>
<script>
  document.getElementById('io').textContent = 'iframe origin = ' + location.origin;
  function go(scheme){
    document.getElementById('log').textContent =
      'navigasi (dari iframe): ' + scheme + '\n>>> PERHATIKAN ADDRESS BAR';
    location.href = scheme;   // dipicu DARI DALAM iframe → sourceFrame = iframe
  }
</script>
</body>
