<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari Permission-Enforcement Probe</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;line-height:1.5}
  h1{font-size:18px}
  button{font-size:16px;padding:12px 16px;margin:6px 0;width:100%}
  #log{white-space:pre-wrap;background:#111;color:#0f0;padding:12px;border-radius:8px;
       font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:12px;min-height:120px}
  .cfg{background:#fffbdd;padding:8px;border-radius:6px;font-size:13px}
  video{width:120px;border:1px solid #ccc;margin-top:8px}
</style>
</head>
<body>
<h1>Safari Permission-Enforcement Probe</h1>
<p class="cfg"><b>Cara uji:</b> set <code>WEBHOOK</code>. Untuk tiap probe, saat Safari minta izin
pilih <b>Deny / Don’t Allow</b>, lalu lihat apakah akses tetap jalan. Bug = akses jalan
<i>setelah</i> Deny. Rekam layar sebagai bukti ASB.</p>

<button onclick="cam()">Probe 1 — getUserMedia (klik Deny saat diminta)</button>
<button onclick="camAgain()">Probe 1b — panggil ulang setelah Deny</button>
<button onclick="clip()">Probe 2 — clipboard.readText tanpa gesture-asli</button>
<button onclick="geo()">Probe 3 — geolocation setelah revoke</button>

<div id="log">ready…</div>
<video id="v" autoplay muted playsinline></video>

<script>
// ====== CONFIG ======
var WEBHOOK = "https://webhook.site/e77cdf6b-d4e1-49fc-9a0e-fda3344aa342";
var NONCE   = Math.random().toString(36).slice(2,8);
// ====================
function out(s){ var l=document.getElementById('log'); l.textContent += "\n"+s; }
function beacon(path,data){ new Image().src = WEBHOOK+path+"?n="+NONCE+"&"+data; out("→ "+path+" "+data); }

function cam(){
  navigator.mediaDevices.getUserMedia({video:true})
   .then(function(s){ document.getElementById('v').srcObject=s;
     out("CAM granted (track live="+s.getVideoTracks()[0].readyState+")"); beacon("/cam","granted=1"); })
   .catch(function(e){ out("CAM denied "+e.name); beacon("/cam","denied="+e.name); });
}
// panggil lagi setelah user Deny — cek apakah bypass tanpa prompt kedua
function camAgain(){ setTimeout(cam, 300); }

function clip(){
  navigator.clipboard.readText()
   .then(function(t){ out("CLIP read len="+t.length); beacon("/clip","read="+t.length); })
   .catch(function(e){ out("CLIP blocked "+e.name); beacon("/clip","blocked="+e.name); });
}

function geo(){
  navigator.geolocation.getCurrentPosition(
    function(p){ out("GEO got "+p.coords.latitude.toFixed(2)+","+p.coords.longitude.toFixed(2));
      beacon("/geo","got=1"); },
    function(e){ out("GEO blocked "+e.code+" "+e.message); beacon("/geo","blocked="+e.code); },
    {enableHighAccuracy:true, timeout:5000, maximumAge:0}
  );
}
</script>
</body>
</html>
