<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 Tabunganku</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --hijau: #22c55e;
      --hijau-muda: #dcfce7;
      --merah: #ef4444;
      --merah-muda: #fee2e2;
      --biru: #3b82f6;
      --kuning: #f59e0b;
      --ungu: #8b5cf6;
      --bg: #f0fdf4;
      --putih: #ffffff;
      --abu: #64748b;
      --gelap: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--gelap);
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      padding: 24px 20px;
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '💰';
      position: absolute;
      font-size: 120px;
      opacity: 0.08;
      top: -20px;
      right: -20px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* SUMMARY CARDS */
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .sum-card {
      background: var(--putih);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 2px solid transparent;
      transition: transform 0.2s;
    }

    .sum-card:hover { transform: translateY(-2px); }

    .sum-card.saldo { border-color: var(--hijau); }
    .sum-card.masuk { border-color: var(--biru); }
    .sum-card.keluar { border-color: var(--merah); }

    .sum-icon {
      font-size: 28px;
      margin-bottom: 6px;
    }

    .sum-label {
      font-size: 12px;
      color: var(--abu);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sum-amount {
      font-size: 20px;
      font-weight: 900;
      margin-top: 4px;
    }

    .sum-card.saldo .sum-amount { color: var(--hijau); }
    .sum-card.masuk .sum-amount { color: var(--biru); }
    .sum-card.keluar .sum-amount { color: var(--merah); }

    /* FORM */
    .form-card {
      background: var(--putih);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }

    .form-card h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 13px;
      font-weight: 700;
      color: var(--abu);
    }

    input, select {
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 600;
      transition: border-color 0.2s;
      background: #f8fafc;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--hijau);
      background: white;
    }

    .tipe-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tipe-btn {
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tipe-btn.masuk.active {
      background: #dbeafe;
      border-color: var(--biru);
      color: var(--biru);
    }

    .tipe-btn.keluar.active {
      background: var(--merah-muda);
      border-color: var(--merah);
      color: var(--merah);
    }

    .btn-tambah {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-tambah:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(34,197,94,0.3);
    }

    /* RIWAYAT */
    .riwayat-card {
      background: var(--putih);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .riwayat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .riwayat-header h2 {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-export {
      padding: 10px 18px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-export:hover { transform: translateY(-1px); }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
    }

    .filter-btn.active { background: var(--gelap); color: white; border-color: var(--gelap); }
    .filter-btn.masuk.active { background: var(--biru); border-color: var(--biru); color: white; }
    .filter-btn.keluar.active { background: var(--merah); border-color: var(--merah); color: white; }

    /* TRANSAKSI ITEM */
    .transaksi-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .transaksi-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      transition: transform 0.2s;
      position: relative;
    }

    .transaksi-item:hover { transform: translateX(4px); }

    .transaksi-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .transaksi-item.masuk .transaksi-icon { background: #dbeafe; }
    .transaksi-item.keluar .transaksi-icon { background: var(--merah-muda); }

    .transaksi-info { flex: 1; min-width: 0; }

    .transaksi-nama {
      font-size: 15px;
      font-weight: 700;
      color: var(--gelap);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .transaksi-meta {
      font-size: 12px;
      color: var(--abu);
      margin-top: 2px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .kategori-badge {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      background: #e2e8f0;
      color: var(--abu);
    }

    .transaksi-amount {
      font-size: 16px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .transaksi-item.masuk .transaksi-amount { color: var(--biru); }
    .transaksi-item.keluar .transaksi-amount { color: var(--merah); }

    .btn-hapus {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 6px;
      transition: background 0.2s;
      opacity: 0.5;
    }

    .btn-hapus:hover { background: var(--merah-muda); opacity: 1; }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--abu);
    }

    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .empty-state p { font-size: 15px; font-weight: 600; }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 20px;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      transform: translateX(150%);
      transition: transform 0.3s ease;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show { transform: translateX(0); }
    .toast.success { background: var(--hijau); }
    .toast.error { background: var(--merah); }
    .toast.info { background: var(--kuning); }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      .summary { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: 1; }
      .sum-amount { font-size: 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>💰 Tabunganku</h1>
  <p>Catat pemasukan & pengeluaranmu dengan mudah!</p>
</header>

<div class="container">

  <!-- SUMMARY -->
  <div class="summary">
    <div class="sum-card saldo">
      <div class="sum-icon">💵</div>
      <div class="sum-label">Saldo</div>
      <div class="sum-amount" id="totalSaldo">Rp 0</div>
    </div>
    <div class="sum-card masuk">
      <div class="sum-icon">📈</div>
      <div class="sum-label">Total Masuk</div>
      <div class="sum-amount" id="totalMasuk">Rp 0</div>
    </div>
    <div class="sum-card keluar">
      <div class="sum-icon">📉</div>
      <div class="sum-label">Total Keluar</div>
      <div class="sum-amount" id="totalKeluar">Rp 0</div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-card">
    <h2>✏️ Tambah Transaksi</h2>

    <div class="form-group" style="margin-bottom:14px;">
      <label>Jenis Transaksi</label>
      <div class="tipe-toggle">
        <button class="tipe-btn masuk active" id="btnMasuk" onclick="setTipe('masuk')">
          📈 Pemasukan
        </button>
        <button class="tipe-btn keluar" id="btnKeluar" onclick="setTipe('keluar')">
          📉 Pengeluaran
        </button>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Keterangan</label>
        <input type="text" id="inputNama" placeholder="Contoh: Gaji, Makan siang..." maxlength="50">
      </div>
      <div class="form-group">
        <label>Jumlah (Rp)</label>
        <input type="number" id="inputJumlah" placeholder="50000" min="0">
      </div>
      <div class="form-group">
        <label>Kategori</label>
        <select id="inputKategori">
          <option value="Umum">📦 Umum</option>
          <option value="Makanan">🍔 Makanan</option>
          <option value="Transport">🚗 Transport</option>
          <option value="Belanja">🛍️ Belanja</option>
          <option value="Tagihan">📄 Tagihan</option>
          <option value="Hiburan">🎮 Hiburan</option>
          <option value="Kesehatan">💊 Kesehatan</option>
          <option value="Gaji">💼 Gaji</option>
          <option value="Bonus">🎁 Bonus</option>
          <option value="Lainnya">✨ Lainnya</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tanggal</label>
        <input type="date" id="inputTanggal">
      </div>
      <div class="form-group full">
        <label>Catatan (opsional)</label>
        <input type="text" id="inputCatatan" placeholder="Tambahkan catatan..." maxlength="100">
      </div>
    </div>

    <button class="btn-tambah" onclick="tambahTransaksi()">
      ➕ Tambah Transaksi
    </button>
  </div>

  <!-- RIWAYAT -->
  <div class="riwayat-card">
    <div class="riwayat-header">
      <h2>📋 Riwayat Transaksi</h2>
      <button class="btn-export" onclick="exportCSV()">
        📊 Export CSV
      </button>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setFilter('semua', this)">Semua</button>
      <button class="filter-btn masuk" onclick="setFilter('masuk', this)">📈 Masuk</button>
      <button class="filter-btn keluar" onclick="setFilter('keluar', this)">📉 Keluar</button>
    </div>

    <div class="transaksi-list" id="transaksiList">
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>Belum ada transaksi. Yuk tambahkan!</p>
      </div>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  // DATA
  let transaksi = JSON.parse(localStorage.getItem('tabungan') || '[]');
  let tipeAktif = 'masuk';
  let filterAktif = 'semua';

  // SET TANGGAL DEFAULT
  document.getElementById('inputTanggal').value = new Date().toISOString().split('T')[0];

  // KATEGORI ICON
  const kategoriIcon = {
    'Umum': '📦', 'Makanan': '🍔', 'Transport': '🚗',
    'Belanja': '🛍️', 'Tagihan': '📄', 'Hiburan': '🎮',
    'Kesehatan': '💊', 'Gaji': '💼', 'Bonus': '🎁', 'Lainnya': '✨'
  };

  // FORMAT RUPIAH
  function formatRp(num) {
    return 'Rp ' + Math.abs(num).toLocaleString('id-ID');
  }

  // SET TIPE
  function setTipe(tipe) {
    tipeAktif = tipe;
    document.getElementById('btnMasuk').className = 'tipe-btn masuk' + (tipe === 'masuk' ? ' active' : '');
    document.getElementById('btnKeluar').className = 'tipe-btn keluar' + (tipe === 'keluar' ? ' active' : '');
  }

  // SET FILTER
  function setFilter(filter, el) {
    filterAktif = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderTransaksi();
  }

  // TAMBAH TRANSAKSI
  function tambahTransaksi() {
    const nama = document.getElementById('inputNama').value.trim();
    const jumlah = parseFloat(document.getElementById('inputJumlah').value);
    const kategori = document.getElementById('inputKategori').value;
    const tanggal = document.getElementById('inputTanggal').value;
    const catatan = document.getElementById('inputCatatan').value.trim();

    if (!nama) { showToast('❗ Keterangan tidak boleh kosong!', 'error'); return; }
    if (!jumlah || jumlah <= 0) { showToast('❗ Jumlah harus lebih dari 0!', 'error'); return; }
    if (!tanggal) { showToast('❗ Tanggal harus diisi!', 'error'); return; }

    const data = {
      id: Date.now(),
      tipe: tipeAktif,
      nama, jumlah, kategori, tanggal, catatan
    };

    transaksi.unshift(data);
    simpan();
    renderTransaksi();
    updateSummary();

    // Reset form
    document.getElementById('inputNama').value = '';
    document.getElementById('inputJumlah').value = '';
    document.getElementById('inputCatatan').value = '';

    showToast(tipeAktif === 'masuk' ? '✅ Pemasukan ditambahkan!' : '✅ Pengeluaran ditambahkan!', 'success');
  }

  // HAPUS TRANSAKSI
  function hapus(id) {
    transaksi = transaksi.filter(t => t.id !== id);
    simpan();
    renderTransaksi();
    updateSummary();
    showToast('🗑️ Transaksi dihapus', 'error');
  }

  // SIMPAN KE LOCALSTORAGE
  function simpan() {
    localStorage.setItem('tabungan', JSON.stringify(transaksi));
  }

  // UPDATE SUMMARY
  function updateSummary() {
    const masuk = transaksi.filter(t => t.tipe === 'masuk').reduce((s, t) => s + t.jumlah, 0);
    const keluar = transaksi.filter(t => t.tipe === 'keluar').reduce((s, t) => s + t.jumlah, 0);
    const saldo = masuk - keluar;

    document.getElementById('totalSaldo').textContent = formatRp(saldo);
    document.getElementById('totalMasuk').textContent = formatRp(masuk);
    document.getElementById('totalKeluar').textContent = formatRp(keluar);

    // Warna saldo
    const elSaldo = document.getElementById('totalSaldo');
    elSaldo.style.color = saldo >= 0 ? 'var(--hijau)' : 'var(--merah)';
  }

  // RENDER TRANSAKSI
  function renderTransaksi() {
    const list = document.getElementById('transaksiList');
    const filtered = filterAktif === 'semua' ? transaksi : transaksi.filter(t => t.tipe === filterAktif);

    if (filtered.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="icon">${filterAktif === 'masuk' ? '📈' : filterAktif === 'keluar' ? '📉' : '📭'}</div>
          <p>${filterAktif === 'semua' ? 'Belum ada transaksi. Yuk tambahkan!' : 'Belum ada data ' + filterAktif}</p>
        </div>`;
      return;
    }

    list.innerHTML = filtered.map(t => {
      const tgl = new Date(t.tanggal).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
      const icon = kategoriIcon[t.kategori] || '📦';
      const prefix = t.tipe === 'masuk' ? '+' : '-';
      return `
        <div class="transaksi-item ${t.tipe}">
          <div class="transaksi-icon">${icon}</div>
          <div class="transaksi-info">
            <div class="transaksi-nama">${t.nama}</div>
            <div class="transaksi-meta">
              <span>${tgl}</span>
              <span class="kategori-badge">${t.kategori}</span>
              ${t.catatan ? `<span>· ${t.catatan}</span>` : ''}
            </div>
          </div>
          <div class="transaksi-amount">${prefix} ${formatRp(t.jumlah)}</div>
          <button class="btn-hapus" onclick="hapus(${t.id})" title="Hapus">🗑️</button>
        </div>`;
    }).join('');
  }

  // EXPORT CSV
  function exportCSV() {
    if (transaksi.length === 0) {
      showToast('❗ Tidak ada data untuk diexport!', 'error');
      return;
    }

    const header = ['Tanggal', 'Jenis', 'Keterangan', 'Kategori', 'Jumlah', 'Catatan'];
    const rows = transaksi.map(t => [
      t.tanggal,
      t.tipe === 'masuk' ? 'Pemasukan' : 'Pengeluaran',
      t.nama,
      t.kategori,
      t.jumlah,
      t.catatan || ''
    ]);

    const csv = [header, ...rows].map(r => r.map(v => `"${v}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tabunganku_${new Date().toLocaleDateString('id-ID').replace(/\//g,'-')}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('📊 File CSV berhasil didownload!', 'info');
  }

  // TOAST
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = `toast ${type} show`;
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // INIT
  updateSummary();
  renderTransaksi();
</script>

</body>
</html>
