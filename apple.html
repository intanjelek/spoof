<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOP Confirm</title>
<style>body{font-family:-apple-system,sans-serif;padding:16px}
button{font-size:16px;padding:12px;width:100%}
#log{white-space:pre-wrap;background:#111;color:#0f0;padding:12px;font:12px ui-monospace,Menlo;margin-top:12px;min-height:200px}
iframe{width:100%;height:50px}</style>
</head>
<body>
<h1>SOP Confirm — dump isi, bukan cuma length</h1>
<button onclick="go()">Baca iframe cross-origin (tunggu 2 dtk)</button>
<div id="log">ready…</div>
<iframe id="f" src="https://example.com/"></iframe>
<script>
var CROSS="https://example.com/";
function out(s){document.getElementById('log').textContent+="\n"+s;}
function read(tag){
  var f=document.getElementById('f');
  try{
    var doc=f.contentWindow.document;
    var title=doc.title, body=(doc.body?doc.body.innerText:"").slice(0,120),
        html=doc.documentElement.innerHTML.slice(0,120), dom=doc.domain;
    out("["+tag+"] domain="+dom+"\n  title="+JSON.stringify(title)+
        "\n  bodyText="+JSON.stringify(body)+"\n  html="+JSON.stringify(html));
    if(/Example Domain/i.test(title+body+html))
      out("  >>> REAL CROSS-ORIGIN READ (ada teks Example Domain) <<<");
    else
      out("  >>> blank/error doc — BUKAN cross-origin read <<<");
  }catch(e){ out("["+tag+"] SecurityError="+e.name+"  (aman, isolasi bekerja)"); }
}
function go(){
  var f=document.getElementById('f');
  f.src="about:blank";
  setTimeout(function(){ f.src=CROSS; }, 50);
  f.onload=function(){ read("onload"); };
  setTimeout(function(){ read("after-2s"); }, 2000); // tunggu example.com benar2 commit
}
</script>
</body>
</html>
