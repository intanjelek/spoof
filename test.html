<!DOCTYPE html>
<html>
<body>
<button onclick="test()">Test sendAsync Only</button>
<pre id="result">...</pre>
<script>
function test() {
  const r = document.getElementById('result');
  try {
    window.ethereum.sendAsync(
      { method: 'eth_accounts', params: [], 
        id: 1, jsonrpc: '2.0' },
      (err, result) => {
        r.textContent = JSON.stringify(result);
      }
    );
  } catch(e) {
    r.textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
