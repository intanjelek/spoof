<!DOCTYPE html>
<html>
<head>
  <title>imToken Scanner</title>
</head>
<body>
<button onclick="scan()">Scan imToken</button>
<pre id="result">Klik Scan...</pre>

<script>
async function scan() {
  const r = document.getElementById('result');
  let out = '=== imToken Bridge Scanner ===\n\n';

  // 1. Cek webkit message handlers
  out += '--- webkit.messageHandlers ---\n';
  try {
    const handlers = window.webkit?.messageHandlers;
    if (handlers) {
      // Coba nama yang umum di imToken
      const names = [
        'imToken', 'imtoken', 'ETHProvider',
        'TokenProvider', 'callbackHandler',
        'trustedMessageHandler', 'walletHandler',
        '_imToken', 'imTokenHandler',
        'dappBrowser', 'webview',
        'native', 'bridge', 'jsbridge',
        'JSBridge', 'wallet'
      ];
      names.forEach(name => {
        try {
          if (handlers[name]) {
            out += `⚠️ FOUND: ${name}\n`;
          } else {
            out += `✅ Safe: ${name}\n`;
          }
        } catch(e) {}
      });
    } else {
      out += 'webkit.messageHandlers: undefined\n';
    }
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 2. Cek window providers
  out += '\n--- window providers ---\n';
  const providers = [
    'ethereum', 'imToken', 'imTokenApi',
    'callbackHandler', 'web3', 'Web3',
    'trustwallet', 'TokenProvider',
    'imTokenConnect', '_imToken',
    'imtokenBridge', 'ETHProvider'
  ];
  providers.forEach(name => {
    try {
      if (window[name] !== undefined) {
        out += `⚠️ FOUND: window.${name}\n`;
        try {
          const keys = Object.keys(window[name] || {});
          out += `   Keys: ${keys.slice(0,8).join(', ')}\n`;
        } catch(e) {}
      }
    } catch(e) {}
  });

  // 3. Cek ethereum detail
  out += '\n--- ethereum detail ---\n';
  if (window.ethereum) {
    try {
      out += `isMetaMask: ${window.ethereum.isMetaMask}\n`;
      out += `isTrust: ${window.ethereum.isTrust}\n`;
      out += `isImToken: ${window.ethereum.isImToken}\n`;
      out += `isTokenPocket: ${window.ethereum.isTokenPocket}\n`;
      out += `isOKExWallet: ${window.ethereum.isOKExWallet}\n`;
      out += `chainId: ${window.ethereum.chainId}\n`;
      out += `selectedAddress: ${window.ethereum.selectedAddress}\n`;
      
      // Cek semua keys
      out += '\nAll keys:\n';
      for (let key in window.ethereum) {
        out += `  ${key}: ${typeof window.ethereum[key]}\n`;
      }
    } catch(e) {
      out += 'Error: ' + e.message + '\n';
    }
  } else {
    out += 'window.ethereum: NOT FOUND\n';
  }

  // 4. Cek user agent
  out += '\n--- User Agent ---\n';
  out += navigator.userAgent + '\n';

  // 5. Scan semua window object
  out += '\n--- Suspicious window objects ---\n';
  try {
    Object.keys(window).forEach(key => {
      if (key.toLowerCase().includes('token') ||
          key.toLowerCase().includes('wallet') ||
          key.toLowerCase().includes('bridge') ||
          key.toLowerCase().includes('native') ||
          key.toLowerCase().includes('web3') ||
          key.toLowerCase().includes('eth') ||
          key.toLowerCase().includes('imtoken')) {
        out += `⚠️ window.${key}: ${typeof window[key]}\n`;
      }
    });
  } catch(e) {}

  r.textContent = out;

  // Auto copy
  try {
    await navigator.clipboard.writeText(out);
    r.textContent += '\n[Copied!]';
  } catch(e) {}
}
</script>
</body>
</html>
