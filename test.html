<!DOCTYPE html>
<html>
<body>
<button onclick="scan()">Deep Scan</button>
<pre id="result">...</pre>

<script>
async function scan() {
  const r = document.getElementById('result');
  let out = '';

  // 1. ReactNativeWebView - PALING MENARIK!
  out += '=== ReactNativeWebView ===\n';
  try {
    const rnwv = window.ReactNativeWebView;
    out += 'Keys: ' + Object.keys(rnwv).join(', ') + '\n';
    
    // Coba postMessage ke React Native
    try {
      rnwv.postMessage(JSON.stringify({
        type: 'test',
        payload: 'hello'
      }));
      out += '✅ postMessage sent!\n';
    } catch(e) {
      out += 'postMessage error: ' + e.message + '\n';
    }
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 2. imToken.callAPI - SANGAT MENARIK!
  out += '\n=== imToken.callAPI ===\n';
  try {
    const apis = [
      'getAccounts', 'getAddress', 'getWallet',
      'eth_accounts', 'eth_requestAccounts',
      'wallet_getInfo', 'wallet_accounts',
      'getUserInfo', 'getBalance',
      'navigation.goBack', 'user.info',
      'device.getInfo', 'app.getVersion'
    ];

    for (const api of apis) {
      try {
        const result = await new Promise((resolve, reject) => {
          window.imToken.callAPI(api, {}, 
            (err, data) => err ? reject(err) : resolve(data)
          );
          setTimeout(() => resolve('timeout'), 1000);
        });
        out += `${api}: ${JSON.stringify(result)}\n`;
      } catch(e) {
        out += `${api}: error - ${e.message}\n`;
      }
    }
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 3. imToken.postMessage
  out += '\n=== imToken.postMessage ===\n';
  try {
    window.imToken.postMessage(
      JSON.stringify({method: 'getAccounts', id: 1})
    );
    out += 'postMessage sent!\n';
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 4. btcwallet
  out += '\n=== btcwallet ===\n';
  try {
    const btc = window.btcwallet;
    out += 'Keys: ' + Object.keys(btc).join(', ') + '\n';
    
    // Coba get BTC accounts
    if (btc.getAccounts) {
      const accs = await btc.getAccounts();
      out += 'BTC accounts: ' + JSON.stringify(accs) + '\n';
    }
    if (btc.requestAccounts) {
      const accs = await btc.requestAccounts();
      out += 'BTC requestAccounts: ' + JSON.stringify(accs) + '\n';
    }
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 5. ImTokenEventEmitter
  out += '\n=== ImTokenEventEmitter ===\n';
  try {
    const emitter = new window.ImTokenEventEmitter();
    out += 'Keys: ' + Object.keys(emitter).join(', ') + '\n';
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 6. ethereumProvider
  out += '\n=== ethereumProvider ===\n';
  try {
    const ep = window.ethereumProvider;
    out += 'Keys: ' + Object.keys(ep).join(', ') + '\n';
    out += 'isImToken: ' + ep.isImToken + '\n';
    
    // Coba eth_accounts tanpa connect
    const result = await ep.request({
      method: 'eth_accounts'
    });
    out += 'eth_accounts: ' + JSON.stringify(result) + '\n';
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  r.textContent = out;
  try {
    await navigator.clipboard.writeText(out);
    r.textContent += '\n[Copied!]';
  } catch(e) {}
}
</script>
</body>
</html>
