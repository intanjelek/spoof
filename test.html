<!DOCTYPE html>
<html>
<body>
<button onclick="test()">Test MetaMask</button>
<pre id="result">...</pre>

<script>
async function test() {
  const r = document.getElementById('result');
  let out = '';

  // 1. Cek semua property ethereum
  out += '=== ethereum properties ===\n';
  try {
    const props = Object.getOwnPropertyNames(
      Object.getPrototypeOf(window.ethereum)
    );
    out += props.join('\n') + '\n';
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 2. Cek apakah ada internal methods
  out += '\n=== All keys ===\n';
  try {
    for (let key in window.ethereum) {
      out += key + ': ' + typeof window.ethereum[key] + '\n';
    }
  } catch(e) {
    out += 'Error: ' + e.message + '\n';
  }

  // 3. Cek selectedAddress (tanpa koneksi)
  out += '\n=== selectedAddress ===\n';
  out += window.ethereum.selectedAddress + '\n';

  // 4. Cek chainId
  out += '\n=== chainId ===\n';
  out += window.ethereum.chainId + '\n';

  // 5. Cek networkVersion
  out += '\n=== networkVersion ===\n';
  out += window.ethereum.networkVersion + '\n';

  r.textContent = out;
}
</script>
</body>
</html>
