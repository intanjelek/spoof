<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome feature-injection recon</title>
<style>
 body{max-width:760px;margin:28px auto;padding:0 16px;font:15px/1.5 system-ui,sans-serif}
 button{padding:12px 18px;font:inherit;font-weight:650;width:100%;margin:6px 0}
 pre{min-height:12em;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;font-size:12px}
 .warn{color:#b23;font-size:12px}
</style>
</head>
<body>
  <main id="main">
    <h1>Chrome feature-injection recon (benign)</h1>
    <p class="warn">Does Chrome expose any feature bridge to page JS, and can it be raced cross-origin? Benign recon.</p>
    <button id="scan" type="button">1 · scan this window for feature bridges/globals</button>
    <button id="watch" type="button">2 · open child, watch 12s for injected bridge/DOM</button>
    <pre id="log" aria-live="polite"></pre>
  </main>

  <script>
  (() => {
    'use strict';
    const params = new URLSearchParams(location.search);
    if (params.has('bootstrap')) { document.querySelector('#main').innerHTML = '<h1>bootstrap</h1>'; return; }

    const output = document.querySelector('#log');
    const scanBtn = document.querySelector('#scan');
    const watchBtn = document.querySelector('#watch');

    function log(message) { const t = new Date().toISOString().slice(11,23); output.textContent += '[' + t + '] ' + message + '\n'; }

    const RE = /shop|coupon|price|cart|translate|autofill|assistant|lens|discount|gCrWeb|gcr/i;
    const uaC = /Chrome\/([\d.]+)/.exec(navigator.userAgent);
    log('UA Chrome=' + (uaC ? uaC[1] : 'no') + ' Samsung=' + /SamsungBrowser/.test(navigator.userAgent));
    log('NOTE: real Chrome rarely exposes feature bridges to page JS. A NONE result is the expected answer, not a bug.');

    function scan() {
      const hits = [];
      for (const k in window) { try { if (RE.test(k)) hits.push(k); } catch (e) {} }
      ['chrome', '__gCrWeb', 'cr', 'gCrWeb'].forEach(function (n) { try { if (n in window && hits.indexOf(n) === -1) hits.push(n + '(present)'); } catch (e) {} });
      log('scan hits: ' + (hits.join(', ') || '(none)'));
      try { if ('chrome' in window) log('window.chrome keys: ' + (Object.keys(window.chrome || {}).join(', ') || '(empty — normal)')); } catch (e) {}
    }

    function watch() {
      const w = open('about:blank#shopping', '_blank');
      if (!w) { log('popup blocked — allow popups'); return; }
      log('opened child; watching for injected bridge/DOM…');
      const t0 = performance.now();
      const base = {};
      let found = false;
      try { for (const k in w) base[k] = 1; } catch (e) {}
      const iv = setInterval(function () {
        const dt = Math.round(performance.now() - t0);
        try {
          for (const k in w) { if (!base[k]) { base[k] = 1; const hit = RE.test(k); log('+' + dt + 'ms new global: ' + k + (hit ? '  <== MATCH' : '')); if (hit) found = true; } }
          const root = w.document && w.document.documentElement;
          const html = root ? root.innerHTML : '';
          if (html && RE.test(html)) { found = true; log('+' + dt + 'ms DOM match in child'); }
        } catch (e) { log('+' + dt + 'ms child unreadable (' + e + ')'); clearInterval(iv); return; }
        if (dt > 12000) { clearInterval(iv); log('watch ended. injected page-context bridge: ' + (found ? 'YES — investigate' : 'NONE (expected for Chrome)')); try { w.close(); } catch (e) {} }
      }, 80);
    }

    scanBtn.addEventListener('click', scan);
    watchBtn.addEventListener('click', watch);
    log('ready — tap button 1 or 2');
  })();
  </script>
</body>
</html>
