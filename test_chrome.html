<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Native bridge scanner</title>
<style>
 body{max-width:820px;margin:24px auto;padding:0 16px;font:15px/1.5 system-ui,sans-serif}
 button{padding:12px 18px;font:inherit;font-weight:650;width:100%;margin:6px 0}
 pre{min-height:16em;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;font-size:12px}
 .warn{color:#b23;font-size:12px}
 h1{font-size:17px}
</style>
</head>
<body>
  <main id="main">
    <h1>Native JS-bridge scanner (benign)</h1>
    <p class="warn">Open in ANY browser / in-app browser / wallet DApp browser. Enumerates native bridges exposed to
    page JS (the Kindred-style attack surface). Read-only: it only reads names/method lists, never calls a bridge method.</p>
    <button id="scan" type="button">scan for exposed native bridges</button>
    <pre id="log" aria-live="polite"></pre>
  </main>

  <script>
  (() => {
    'use strict';
    const output = document.querySelector('#log');
    const scanBtn = document.querySelector('#scan');
    function log(m){ output.textContent += m + '\n'; }

    // native function? (injected @JavascriptInterface / WKWebView methods report [native code])
    function isNative(fn){ try { return typeof fn === 'function' && /\[native code\]/.test(Function.prototype.toString.call(fn)); } catch(e){ return false; } }
    function ownMethods(obj){
      const out = [];
      try { for (const k of Object.getOwnPropertyNames(obj)) { try { if (typeof obj[k] === 'function') out.push(k + (isNative(obj[k]) ? '·native' : '')); } catch(e){} } } catch(e){}
      try { for (const k in obj) { try { if (typeof obj[k] === 'function' && out.indexOf(k + '·native') === -1 && out.indexOf(k) === -1) out.push(k + (isNative(obj[k]) ? '·native' : '') + '(inh)'); } catch(e){} } } catch(e){}
      return out;
    }

    // KNOWN bridge/provider names (high confidence if present)
    const KNOWN = [
      // crypto wallet providers
      'ethereum','solana','web3','BinanceChain','tronWeb','tron','phantom','coinbaseWalletExtension','keplr','cardano','aptos','martian',
      // WKWebView / RN / hybrid bridges
      'webkit','ReactNativeWebView','flutter_inappwebview','Capacitor','cordova','Ionic','DartBridge','__nativeBridge','nativeBridge','JSBridge','jsBridge','external',
      // Samsung / OEM / shopping / telemetry
      'KindredWebInterface','SBrowser','samsung','__gCrWeb','gCrWeb','YandexBridge','yandex','UCBrowser','ucweb','MiuiBrowser','MiBrowser','HuaweiBridge','hbrowser','operaBridge','opr',
      // Meta IAB
      'iabjs_unified_bridge','__call_iabjs_unified_bridge','_AutofillCallbackHandler',
      // generic
      'Android','AndroidBridge','nativeApp','AppBridge','mobileBridge','__bridge','bridge','NativeInterface'
    ];

    // standard globals to skip in the heuristic pass
    const STD = new Set(['window','self','document','location','navigator','history','screen','frames','parent','top','opener',
      'localStorage','sessionStorage','indexedDB','crypto','performance','console','customElements','visualViewport',
      'speechSynthesis','caches','cookieStore','scheduler','trustedTypes','clientInformation','styleMedia','applicationCache']);

    function scan(){
      output.textContent = '';
      log('=== native bridge scan ===');
      log('UA: ' + navigator.userAgent);
      log('origin: ' + location.origin + '\n');

      // 1) known names
      log('-- known bridge/provider names --');
      let anyKnown = false;
      KNOWN.forEach(function(n){
        let v; try { v = window[n]; } catch(e){ return; }
        if (v === undefined || v === null) return;
        anyKnown = true;
        let extra = '';
        if (n === 'ethereum' && typeof v === 'object') { extra = ' [isMetaMask=' + v.isMetaMask + ' isTrust=' + v.isTrust + ' isCoinbase=' + v.isCoinbaseWallet + ']'; }
        if (n === 'external') { extra += ' (standard Chrome object — ignore AddSearchProvider/IsSearchProviderInstalled; only custom methods matter)'; }
        const methods = (typeof v === 'object' || typeof v === 'function') ? ownMethods(v) : [];
        log('  ' + n + ' = ' + (typeof v) + extra + (methods.length ? '  methods: ' + methods.slice(0,40).join(', ') : ''));
      });
      if (!anyKnown) log('  (none)');

      // 2) webkit.messageHandlers (iOS WKWebView bridges)
      log('\n-- webkit.messageHandlers (iOS) --');
      try {
        if (window.webkit && window.webkit.messageHandlers) {
          let keys = [];
          try { keys = Object.keys(window.webkit.messageHandlers); } catch(e){}
          if (keys.length) log('  handlers: ' + keys.join(', '));
          else {
            // keys often non-enumerable; probe common handler names
            const probes = ['iabjs_idle_callback','BrowserDeclutterJS','IABInnerFrameJS','KindredWebInterface','setPaymentAutofillValueInAllFramesForIABIOS','nativeBridge','jsBridge','logging'];
            const found = probes.filter(function(p){ try { return typeof window.webkit.messageHandlers[p] !== 'undefined'; } catch(e){ return false; } });
            log('  present (keys not enumerable). probed hits: ' + (found.join(', ') || '(none of the common names)'));
          }
        } else log('  (no window.webkit.messageHandlers — not an iOS WKWebView, or none exposed)');
      } catch(e){ log('  err ' + e); }

      // 3) heuristic: any window prop that is an object/function with OWN native methods
      log('\n-- heuristic: non-standard globals with native methods --');
      let anyHeur = false;
      let names = [];
      try { names = Object.getOwnPropertyNames(window); } catch(e){}
      names.forEach(function(name){
        if (STD.has(name) || KNOWN.indexOf(name) !== -1) return;
        let v; try { v = window[name]; } catch(e){ return; }
        if (!v || (typeof v !== 'object' && typeof v !== 'function')) return;
        // skip DOM elements (id-named globals) and standard constructors
        try { if (v && v.nodeType) return; } catch(e){}
        let nativeM = [];
        // ONLY enumerable own native methods: injected @JavascriptInterface bridges expose enumerable methods;
        // standard built-in constructors' static methods are non-enumerable -> correctly excluded.
        try { for (const k in v) { if (!Object.prototype.hasOwnProperty.call(v, k)) continue; try { if (typeof v[k] === 'function' && isNative(v[k])) nativeM.push(k); } catch(e){} } } catch(e){}
        if (nativeM.length) { anyHeur = true; log('  window.' + name + '  enumerable-native-methods: ' + nativeM.slice(0,30).join(', ') + '   <== REVIEW (injected bridge?)'); }
      });
      if (!anyHeur) log('  (none — typical for hardened browsers like Chrome/Safari)');

      log('\n=== done. "native" methods on an object you did NOT create = an injected native bridge = Kindred-style attack surface. ===');
    }

    scanBtn.addEventListener('click', scan);
    log('ready — tap the button');
  })();
  </script>
</body>
</html>
